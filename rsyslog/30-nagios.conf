# /etc/rsyslog.d/30-nagios.conf  (NMS)
# Bitacora propia con los eventos de Nagios (alertas, notificaciones, cambios de estado)
# y el registro de cada mensaje enviado a Telegram (etiqueta nagios-telegram).
if ($programname startswith "nagios") then {
    action(type="omfile" file="/var/log/nagios-eventos.log")
}
