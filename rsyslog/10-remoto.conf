# /etc/rsyslog.d/10-remoto.conf  (NMS)
# Recibe syslog del router Cisco y del Ubuntu Server por UDP/514
# y guarda un archivo por equipo en /var/log/remoto/<IP>.log
module(load="imudp")
input(type="imudp" port="514" ruleset="remoto")

template(name="ArchivoRemoto" type="string" string="/var/log/remoto/%FROMHOST-IP%.log")

ruleset(name="remoto") {
    action(type="omfile" dynaFile="ArchivoRemoto")
    stop
}
