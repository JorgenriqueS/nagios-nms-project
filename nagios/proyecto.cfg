###############################################################################
# proyecto.cfg - Proyecto final NMS (Nagios Core)
# Ruta: /usr/local/nagios/etc/objects/proyecto.cfg
#
# Equipos: localhost (NMS 192.168.20.20) | ubuntu-srv | r-cisco (EVE-NG)
# Credenciales SNMPv3 en resource.cfg: $USER10$ usuario, $USER11$ clave auth, $USER12$ clave priv
###############################################################################

# =============================== PLANTILLAS ==================================
# Servicio SNMP con chequeo cada minuto e icono de grafica (PNP4Nagios)
#
# UMBRALES (lo que define OK / WARNING / CRITICAL en la GUI):
#   Utilizacion de Disco Duro           % usado          WARNING >= 50   CRITICAL >= 70
#   Memoria Total y En Uso              % en uso         WARNING >= 50   CRITICAL >= 70
#   Cantidad de Usuarios en el Sistema  sesiones         WARNING >= 3    CRITICAL >= 4
#   Trafico Interfaz <if>               Mbps (max RX/TX) WARNING >= 5    CRITICAL >= 10  (+ CRITICAL si DOWN)
#   Trafico de Paquetes ICMP            pkt/s (max)      WARNING >= 3    CRITICAL >= 10
#   Ping ICMP                           RTA / perdida    WARNING 100ms o 20%   CRITICAL 500ms o 60%
# Son valores bajos a proposito para poder demostrar los cambios de estado en el laboratorio.
define service{
    name                    srv-snmp
    use                     generic-service
    check_interval          1
    retry_interval          1
    action_url              /pnp4nagios/index.php/graph?host=$HOSTNAME$&srv=$SERVICEDESC$
    register                0
}

# ================================= HOSTS =====================================
define host{
    use                     linux-server
    host_name               ubuntu-srv
    alias                   Ubuntu Server monitoreado
    address                 192.168.20.22
    check_interval          1                    ; chequeo de vida cada minuto
    retry_interval          1
    max_check_attempts      3                    ; DOWN (HARD) en ~3 minutos
    action_url              /pnp4nagios/index.php/graph?host=$HOSTNAME$&srv=_HOST_
}

define host{
    use                     generic-switch
    host_name               r-cisco
    alias                   Router Cisco (EVE-NG)
    address                 192.168.20.24
    check_interval          1                    ; chequeo de vida cada minuto
    retry_interval          1
    max_check_attempts      3                    ; DOWN (HARD) en ~3 minutos
    action_url              /pnp4nagios/index.php/graph?host=$HOSTNAME$&srv=_HOST_
}

# =============================== HOSTGROUPS ==================================
define hostgroup{
    hostgroup_name          linux-snmp
    alias                   Servidores Linux por SNMP
    members                 localhost,ubuntu-srv
}

define hostgroup{
    hostgroup_name          cisco-snmp
    alias                   Equipos Cisco por SNMP
    members                 r-cisco
}

define hostgroup{
    hostgroup_name          equipos-remotos
    alias                   Equipos remotos
    members                 ubuntu-srv,r-cisco
}

# ================================ COMANDOS ===================================
define command{
    command_name    check_snmp_nms
    command_line    $USER1$/check_snmp_nms.sh -H $HOSTADDRESS$ -u '$USER10$' -A '$USER11$' -X '$USER12$' $ARG1$
}

# --- Notificaciones a Telegram (el chat_id va en el campo "pager" del contacto)
define command{
    command_name    notify-host-by-telegram
    command_line    $USER1$/notify_telegram.sh host "$CONTACTPAGER$" "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$HOSTADDRESS$" "$HOSTSTATE$" "$HOSTOUTPUT$" "$LONGDATETIME$"
}

define command{
    command_name    notify-service-by-telegram
    command_line    $USER1$/notify_telegram.sh service "$CONTACTPAGER$" "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$HOSTADDRESS$" "$SERVICEDESC$" "$SERVICESTATE$" "$SERVICEOUTPUT$" "$LONGDATETIME$"
}

# --- Perfdata en modo bulk para PNP4Nagios (NPCD)
define command{
    command_name    process-service-perfdata-file
    command_line    /bin/mv /usr/local/pnp4nagios/var/service-perfdata /usr/local/pnp4nagios/var/spool/service-perfdata.$TIMET$
}

define command{
    command_name    process-host-perfdata-file
    command_line    /bin/mv /usr/local/pnp4nagios/var/host-perfdata /usr/local/pnp4nagios/var/spool/host-perfdata.$TIMET$
}

# ================================ CONTACTO ===================================
define contact{
    contact_name                    encargado-telegram
    alias                           Encargado de monitoreo (Telegram)
    pager                           CAMBIAR_CHAT_ID            ; chat_id de Telegram
    host_notifications_enabled      1
    service_notifications_enabled   1
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,u,r,f
    service_notification_options    w,u,c,r,f
    host_notification_commands      notify-host-by-telegram
    service_notification_commands   notify-service-by-telegram
}
# Agregar "encargado-telegram" a members del contactgroup "admins" en contacts.cfg

# ================= SERVICIOS COMUNES: localhost + ubuntu-srv ==================
# Los dos hosts Linux tienen exactamente los mismos servicios.
define service{
    use                     srv-snmp
    hostgroup_name          linux-snmp
    service_description     Utilizacion de Disco Duro
    check_command           check_snmp_nms!-m disk -p / -w 50 -c 70
}

define service{
    use                     srv-snmp
    hostgroup_name          linux-snmp
    service_description     Memoria Total y En Uso
    check_command           check_snmp_nms!-m mem -w 50 -c 70
}

define service{
    use                     srv-snmp
    hostgroup_name          linux-snmp
    service_description     Cantidad de Usuarios en el Sistema
    check_command           check_snmp_nms!-m users -w 3 -c 4
}

# ====================== SERVICIOS: ROUTER CISCO ==============================
define service{
    use                     srv-snmp
    hostgroup_name          cisco-snmp
    service_description     Memoria Total y En Uso
    check_command           check_snmp_nms!-m mem-cisco -w 50 -c 70
}

# ==================== SERVICIOS ICMP: los tres equipos =======================
define service{
    use                     srv-snmp
    hostgroup_name          linux-snmp,cisco-snmp
    service_description     Trafico de Paquetes ICMP
    check_command           check_snmp_nms!-m icmp -w 3 -c 10
}

define service{
    use                     srv-snmp
    hostgroup_name          linux-snmp,cisco-snmp
    service_description     Ping ICMP
    check_command           check_ping!100.0,20%!500.0,60%
}

# ============ REINICIOS: los tres equipos (aunque vuelvan rapido) ============
# WARNING mientras el equipo lleve menos de 10 minutos encendido -> aviso por Telegram
define service{
    use                     srv-snmp
    hostgroup_name          linux-snmp,cisco-snmp
    service_description     Tiempo Encendido
    check_command           check_snmp_nms!-m uptime -w 10
}

# =================== SERVICIOS: TRAFICO EN LAS INTERFACES ====================
# Ajusta los nombres con: ip -br link (Linux) o el snmpwalk del paso 1.4 (router)
define service{
    use                     srv-snmp
    host_name               localhost
    service_description     Trafico Interfaz ens33
    check_command           check_snmp_nms!-i ens33 -m iface -w 5 -c 10
}

define service{
    use                     srv-snmp
    host_name               localhost
    service_description     Trafico Interfaz ens37
    check_command           check_snmp_nms!-i ens37 -m iface -w 5 -c 10      ; <-- interfaz LAN del NMS
}

define service{
    use                     srv-snmp
    host_name               ubuntu-srv
    service_description     Trafico Interfaz ens33
    check_command           check_snmp_nms!-i ens33 -m iface -w 5 -c 10
}

define service{
    use                     srv-snmp
    host_name               ubuntu-srv
    service_description     Trafico Interfaz ens37
    check_command           check_snmp_nms!-i ens37 -m iface -w 5 -c 10      ; <-- interfaz LAN del Ubuntu
}

define service{
    use                     srv-snmp
    host_name               r-cisco
    service_description     Trafico Interfaz Ethernet0_0
    check_command           check_snmp_nms!-i Ethernet0/0 -m iface -w 5 -c 10   ; <-- vIOS: GigabitEthernet0/0
}
